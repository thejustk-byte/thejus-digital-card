<div class="expanded" id="expanded" aria-hidden="true"><section class="expand-card glass" role="dialog" aria-modal="true" aria-labelledby="expandTitle"><div class="expand-head"><div class="expand-icon" id="expandIcon"></div><div><h2 id="expandTitle">Contact</h2><p id="expandSubtitle">Quick links</p></div><button class="close glass" id="closeExpand" aria-label="Close">×</button></div><div class="content-list" id="expandContent"></div><div class="qr-wrap" id="qrWrap" hidden><div id="qrcode"></div><p>Scan to open this digital card.</p></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const data={
 contact:{title:'Contact',subtitle:'Reach out or save my details',icon:'<img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3KwHOVnuYOkW2oN0MTIORaA0VtB/89e27f58-d9ba-4501-947b-2d7f20046376.jpg" alt="Thejus T.K." referrerpolicy="no-referrer">',items:[['＋','Save my contact','thejus-tk.vcf','download'],['◉','WhatsApp','https://wa.me/919611638650?text=Hi%20Thejus%2C%20we%20connected%20through%20your%20digital%20card.','external'],['✉','Email me','mailto:thejus.tk@gmail.com'],['⌕','Call me','tel:+919611638650']]},
 social:{title:'Social',subtitle:'Find me around the web',icon:'◎',items:[['in','LinkedIn','https://www.linkedin.com/in/thejus-tk-34966795?originalSubdomain=in','external'],['◎','Instagram','https://www.instagram.com/inexplicable_psyche/','external'],['✉','Email','mailto:thejus.tk@gmail.com']]},
 portfolio:{title:'Portfolio',subtitle:'Work, projects and experiments',icon:'⌘',items:[['⌘','Personal portfolio','https://thejustk-byte.github.io','external'],['◈','GitHub projects','https://github.com/thejustk-byte','external'],['in','Professional profile','https://www.linkedin.com/in/thejus-tk-34966795','external']]},
 interests:{title:'Interests',subtitle:'A few things that keep me curious',icon:'✦',items:[['⌁','Mountain state of mind','Travel · Quiet places · Coastal roots','info'],['↗','Petrolhead energy','Cars · Roads · Precision','info'],['♫','Lost in the frequency','Music · Psytrance','info'],['▧','Frame by frame','Visuals · Creative experiments','info']]},
 github:{title:'GitHub',subtitle:'Building and experimenting',icon:'⌘',items:[['◈','Open GitHub profile','https://github.com/thejustk-byte','external'],['⌘','Personal portfolio','https://thejustk-byte.github.io','external']]},
 share:{title:'Share this card',subtitle:'Pass the connection forward',icon:'↗',items:[['↗','Share my card','#share','share'],['▣','Copy card link','#copy','copy'],['▦','Show QR code','#qr','qr'],['＋','Download contact file','thejus-tk.vcf','download']]}
};
const overlay=document.getElementById('expanded'),content=document.getElementById('expandContent'),icon=document.getElementById('expandIcon'),title=document.getElementById('expandTitle'),subtitle=document.getElementById('expandSubtitle'),qrWrap=document.getElementById('qrWrap'),toast=document.getElementById('toast');let toastTimer,previousFocus=null;
function haptic(){if('vibrate'in navigator){try{navigator.vibrate(14)}catch(e){}}}
function notify(m){haptic();toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function openBubble(key,button){const d=data[key];if(!d)return;haptic();previousFocus=button;title.textContent=d.title;subtitle.textContent=d.subtitle;icon.innerHTML=d.icon;content.replaceChildren();qrWrap.hidden=true;
 d.items.forEach(([sym,label,url,kind])=>{if(kind==='info'){const el=document.createElement('div');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span>';el.children[0].textContent=sym;el.children[1].textContent=label+' · '+url;content.append(el);return}
 const el=document.createElement(kind==='share'||kind==='copy'||kind==='qr'?'button':'a');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span><span class="arrow">↗</span>';el.children[0].textContent=sym;el.children[1].textContent=label;
 if(kind==='download'){el.href=url;el.download=''}else if(kind==='external'||!kind){el.href=url;if(kind==='external'){el.target='_blank';el.rel='noopener noreferrer'}}else{el.type='button';el.addEventListener('click',()=>{if(kind==='share')shareCard();if(kind==='copy')copyLink();if(kind==='qr')showQr()})}
 content.append(el)});
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('closeExpand').focus()}
function closeBubble(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';if(previousFocus)previousFocus.focus();haptic()}

// Album-art style horizontal swipe navigation with depth-aware cards.
const albumTrack=document.getElementById('albumTrack');
const albumCards=[...albumTrack.querySelectorAll('[data-album]')];
const albumDots=[...document.querySelectorAll('[data-go]')];
let albumScrollFrame=0;
function updateAlbum(){
 if(!albumTrack)return;
 const center=albumTrack.scrollLeft+albumTrack.clientWidth/2;
 let selected=0,closest=Infinity;
 albumCards.forEach((card,i)=>{
  const cardCenter=card.offsetLeft+card.offsetWidth/2;
  const delta=cardCenter-center,dist=Math.abs(delta);
  if(dist<closest){closest=dist;selected=i}
  const amount=Math.max(-1,Math.min(1,delta/(albumTrack.clientWidth*.68)));
  card.style.setProperty('--tilt',(amount*9).toFixed(2)+'deg');
  card.classList.toggle('is-active',dist<card.offsetWidth*.48);
  card.setAttribute('aria-current',dist<card.offsetWidth*.48?'true':'false');
 });
 albumDots.forEach((dot,i)=>dot.setAttribute('aria-current',i===selected?'true':'false'));
}
albumTrack.addEventListener('scroll',()=>{if(albumScrollFrame)return;albumScrollFrame=requestAnimationFrame(()=>{updateAlbum();albumScrollFrame=0})},{passive:true});
albumDots.forEach(dot=>dot.addEventListener('click',()=>{const card=albumCards[Number(dot.dataset.go)];if(card)albumTrack.scrollTo({left:card.offsetLeft-(albumTrack.clientWidth-card.offsetWidth)/2,behavior:'smooth'})}));
let albumTouchStart=null;
albumTrack.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const active=albumCards.findIndex(c=>c.classList.contains('is-active'));const next=Math.max(0,Math.min(albumCards.length-1,active+(e.key==='ArrowRight'?1:-1)));albumDots[next]?.click()}});
window.addEventListener('resize',updateAlbum,{passive:true});
window.addEventListener('load',()=>{updateAlbum();setTimeout(updateAlbum,250)});

document.querySelectorAll('[data-bubble]').forEach(b=>b.addEventListener('click',()=>openBubble(b.dataset.bubble,b)));
document.querySelectorAll('[data-direct]').forEach(b=>b.addEventListener('click',()=>{
 const url=b.dataset.direct;
 if(url==='#share'){openBubble('share',b);return}
 if(url.startsWith('https://')||url.startsWith('mailto:')||url.startsWith('tel:')){if(url.startsWith('https://'))window.open(url,'_blank','noopener,noreferrer');else location.href=url}
}));
document.getElementById('closeExpand').addEventListener('click',closeBubble);overlay.addEventListener('click',e=>{if(e.target===overlay)closeBubble()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeBubble()});
async function copyLink(){try{await navigator.clipboard.writeText(location.href);notify('Card link copied')}catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify('Card link copied')}}
async function shareCard(){const d={title:'Thejus T.K. — Digital Card',text:'Connect with Thejus T.K.',url:location.href};if(navigator.share){try{await navigator.share(d)}catch(e){if(e.name!=='AbortError')notify('Sharing was not available')}}else copyLink()}
function showQr(){qrWrap.hidden=false;const target=document.getElementById('qrcode');if(!target.dataset.ready){if(window.QRCode){new QRCode(target,{text:location.href,width:210,height:210,colorDark:'#08080a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});target.dataset.ready='1'}else notify('QR generator unavailable. Check your connection')}qrWrap.scrollIntoView({behavior:'smooth',block:'nearest'})}
</script>
