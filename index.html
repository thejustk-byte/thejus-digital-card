<style>

.wrap{width:min(100% - 28px,680px);margin:0 auto;padding:calc(17px + env(safe-area-inset-top)) 0 calc(22px + env(safe-area-inset-bottom))}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#d0d0dc;font-size:9px;letter-spacing:.13em;font-weight:750}.status{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#a5ffcf;box-shadow:0 0 12px #a5ffcf}
.hero{text-align:center;padding:7px 0 12px}.orbit-scene{position:relative;width:74px;aspect-ratio:1;margin:0 auto 7px;display:grid;place-items:center}.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.14);animation:spin 32s linear infinite}.ring:before,.ring:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--cyan)}.ring:before{top:14%;left:21%}.ring:after{right:11%;bottom:22%;background:var(--purple)}.ring.r2{inset:15%;border-style:dashed;border-color:rgba(255,255,255,.12);animation:spinback 42s linear infinite}.ring.r3{inset:30%;border-color:rgba(255,255,255,.1)}.core{width:76%;aspect-ratio:1;border-radius:50%;padding:2px;background:conic-gradient(var(--cyan),#fff,var(--purple),var(--mint),var(--cyan));box-shadow:0 0 30px rgba(171,204,255,.22);animation:breathe 5s ease-in-out infinite}.core-inner{height:100%;border-radius:50%;background:#18181d;border:2px solid rgba(12,12,15,.95);overflow:hidden}.profile-photo{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinback{to{transform:rotate(-360deg)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04);filter:brightness(1.15)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}@keyframes pop{from{opacity:0;transform:scale(.87) translateY(9px)}to{opacity:1;transform:scale(1) translateY(0)}}
h1{font-size:clamp(25px,6vw,34px);letter-spacing:-.065em;line-height:1.05;margin:0 0 6px;font-weight:780}.subtitle{color:#d5d5df;font-size:12px;line-height:1.5;margin:0}.tagline{font-size:8px;letter-spacing:.08em;color:#b2b2c0;line-height:1.7;margin:7px 0 0}
.bubble-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,3vw,18px);padding:10px 2px 14px;max-width:620px;margin:0 auto}
.bubble{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1;min-width:0;border-radius:50%;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;color:var(--ink);cursor:pointer;border:1px solid rgba(255,255,255,.24);background:radial-gradient(circle at 25% 13%,rgba(255,255,255,.3),transparent 36%),linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 54%,rgba(255,255,255,.1));backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);box-shadow:inset 0 1.5px 2px rgba(255,255,255,.3),inset 0 -9px 18px rgba(0,0,0,.2),0 11px 25px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent;animation:float 6s ease-in-out infinite}
.bubble:nth-child(2n){animation-delay:-2s}.bubble:nth-child(3n){animation-delay:-3.4s}.bubble:before{content:"";position:absolute;inset:-60% -100%;z-index:-1;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);background-size:200% 100%;animation:sheen 8s linear infinite;pointer-events:none}.bubble:after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(140deg,rgba(167,230,255,.16),transparent 47%,rgba(241,181,255,.18));opacity:.65;transition:opacity .25s}
.bubble:hover,.bubble:focus-visible{transform:scale(1.07);border-color:rgba(255,255,255,.5);box-shadow:inset 0 1.5px 2px rgba(255,255,255,.35),0 16px 35px rgba(0,0,0,.35),0 0 22px rgba(167,230,255,.1);outline:none}.bubble:active{transform:scale(.94)}
.bubble-icon{width:clamp(42px,12vw,62px);height:clamp(42px,12vw,62px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.33),rgba(255,255,255,.055) 66%);border:1px solid rgba(255,255,255,.27);box-shadow:inset 0 2px 4px rgba(255,255,255,.22),0 7px 17px rgba(0,0,0,.2);font-size:22px;flex:0 0 auto}.bubble-icon svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.bubble-icon img{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}.bubble:first-child .bubble-icon{padding:0;overflow:hidden;border-color:rgba(255,255,255,.5)}.bubble strong{font-size:clamp(10px,2.6vw,12px);font-weight:760;letter-spacing:-.015em}.bubble small{font-size:clamp(7px,2vw,9px);color:#d0d0da;line-height:1.3}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 12px 30px rgba(0,0,0,.2)}
.expanded{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(3,3,8,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .24s}.expanded.open{opacity:1;pointer-events:auto}.expand-card{position:relative;width:min(100%,450px);max-height:88svh;overflow:auto;border-radius:34px;padding:23px 19px;background:linear-gradient(150deg,rgba(47,47,56,.96),rgba(15,15,20,.96));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 2px rgba(255,255,255,.23),0 30px 90px rgba(0,0,0,.6);transform:scale(.82);transition:transform .36s cubic-bezier(.2,.8,.2,1)}.expanded.open .expand-card{transform:scale(1);animation:pop .32s ease both}.expand-head{display:flex;align-items:center;gap:13px;margin:0 0 19px}.expand-icon{width:62px;height:62px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 8px 20px rgba(0,0,0,.2);overflow:hidden;padding:0}.expand-icon svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.expand-icon img{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}.expand-head h2{font-size:24px;letter-spacing:-.05em;margin:0}.expand-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.close{margin-left:auto;width:40px;height:40px;flex:0 0 auto;border-radius:50%;color:#fff;font-size:24px;cursor:pointer}.content-list{display:grid;gap:10px}.action{display:flex;align-items:center;gap:12px;min-height:55px;border-radius:19px;padding:12px 14px;color:#f9f9fc;text-decoration:none;font-size:12px;font-weight:650;cursor:pointer;text-align:left;width:100%}.action .act-icon{font-size:19px;width:28px;text-align:center}.action .arrow{margin-left:auto;color:#c7c7d2;font-size:17px}.action:hover{border-color:rgba(255,255,255,.45);background:linear-gradient(120deg,rgba(167,230,255,.16),rgba(241,181,255,.12))}
.qr-wrap{text-align:center;margin-top:18px}.qr-wrap #qrcode{display:inline-block;background:white;padding:12px;border-radius:14px}.qr-wrap p{color:var(--muted);font-size:11px}.footer{text-align:center;color:#858592;font-size:8px;letter-spacing:.11em;line-height:1.8;padding:10px 0 3px}.toast{position:fixed;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:linear-gradient(135deg,#fafafa,#c5cada);color:#101014;padding:12px 17px;border-radius:999px;font-size:12px;font-weight:800;transition:.25s;max-width:calc(100% - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.wrap{width:min(100% - 40px,640px)}.bubble-grid{gap:22px}.bubble{border-radius:50%;max-width:155px;justify-self:center;width:100%}.hero{padding-top:8px}.orbit-scene{width:84px}}
@media(max-width:380px){.wrap{width:calc(100% - 20px)}.topline{font-size:7px}.hero{padding:6px 0 10px}.orbit-scene{width:65px;margin-bottom:6px}.bubble-grid{gap:8px;padding-top:8px}.bubble{padding:6px 2px;gap:5px}.bubble-icon{width:clamp(38px,11vw,45px);height:clamp(38px,11vw,45px);font-size:18px}.bubble-icon svg{width:21px;height:21px}.bubble strong{font-size:9px}.bubble small{font-size:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
const data={
 contact:{title:'Contact',subtitle:'Reach out or save my details',icon:'<img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3KwHOVnuYOkW2oN0MTIORaA0VtB/89e27f58-d9ba-4501-947b-2d7f20046376.jpg" alt="Thejus T.K." referrerpolicy="no-referrer">',items:[['＋','Save my contact','thejus-tk.vcf','download'],['◉','WhatsApp','https://wa.me/919611638650?text=Hi%20Thejus%2C%20we%20connected%20through%20your%20digital%20card.','external'],['✉','Email me','mailto:thejus.tk@gmail.com'],['⌕','Call me','tel:+919611638650']]},
 social:{title:'Social',subtitle:'Find me around the web',icon:'◎',items:[['in','LinkedIn','https://www.linkedin.com/in/thejus-tk-34966795?originalSubdomain=in','external'],['◎','Instagram','https://www.instagram.com/inexplicable_psyche/','external'],['✉','Email','mailto:thejus.tk@gmail.com']]},
 portfolio:{title:'Portfolio',subtitle:'Work, projects and experiments',icon:'⌘',items:[['⌘','Personal portfolio','https://thejustk-byte.github.io','external'],['◈','GitHub projects','https://github.com/thejustk-byte','external'],['in','Professional profile','https://www.linkedin.com/in/thejus-tk-34966795','external']]},
 interests:{title:'Interests',subtitle:'A few things that keep me curious',icon:'✦',items:[['⌁','Mountain state of mind','Travel · Quiet places · Coastal roots','info'],['↗','Petrolhead energy','Cars · Roads · Precision','info'],['♫','Lost in the frequency','Music · Psytrance','info'],['▧','Frame by frame','Visuals · Creative experiments','info']]},
 github:{title:'GitHub',subtitle:'Building and experimenting',icon:'⌘',items:[['◈','Open GitHub profile','https://github.com/thejustk-byte','external'],['⌘','Personal portfolio','https://thejustk-byte.github.io','external']]},
 share:{title:'Share this card',subtitle:'Pass the connection forward',icon:'↗',items:[['↗','Share my card','#share','share'],['▣','Copy card link','#copy','copy'],['▦','Show QR code','#qr','qr'],['＋','Download contact file','thejus-tk.vcf','download']]}
};
const overlay=document.getElementById('expanded'),content=document.getElementById('expandContent'),icon=document.getElementById('expandIcon'),title=document.getElementById('expandTitle'),subtitle=document.getElementById('expandSubtitle'),qrWrap=document.getElementById('qrWrap'),toast=document.getElementById('toast');let toastTimer,previousFocus=null;
function haptic(){if('vibrate'in navigator){try{navigator.vibrate(14)}catch(e){}}}
function notify(m){haptic();toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function openBubble(key,button){const d=data[key];if(!d)return;haptic();previousFocus=button;title.textContent=d.title;subtitle.textContent=d.subtitle;icon.innerHTML=d.icon;content.replaceChildren();qrWrap.hidden=true;
 d.items.forEach(([sym,label,url,kind])=>{if(kind==='info'){const el=document.createElement('div');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span>';el.children[0].textContent=sym;el.children[1].textContent=label+' · '+url;content.append(el);return}
 const el=document.createElement(kind==='share'||kind==='copy'||kind==='qr'?'button':'a');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span><span class="arrow">↗</span>';el.children[0].textContent=sym;el.children[1].textContent=label;
 if(kind==='download'){el.href=url;el.download=''}else if(kind==='external'||!kind){el.href=url;if(kind==='external'){el.target='_blank';el.rel='noopener noreferrer'}}else{el.type='button';el.addEventListener('click',()=>{if(kind==='share')shareCard();if(kind==='copy')copyLink();if(kind==='qr')showQr()})}
 content.append(el)});
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('closeExpand').focus()}
function closeBubble(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';if(previousFocus)previousFocus.focus();haptic()}
document.querySelectorAll('[data-bubble]').forEach(b=>b.addEventListener('click',()=>openBubble(b.dataset.bubble,b)));
document.getElementById('closeExpand').addEventListener('click',closeBubble);overlay.addEventListener('click',e=>{if(e.target===overlay)closeBubble()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeBubble()});
async function copyLink(){try{await navigator.clipboard.writeText(location.href);notify('Card link copied')}catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify('Card link copied')}}
async function shareCard(){const d={title:'Thejus T.K. — Digital Card',text:'Connect with Thejus T.K.',url:location.href};if(navigator.share){try{await navigator.share(d)}catch(e){if(e.name!=='AbortError')notify('Sharing was not available')}}else copyLink()}
function showQr(){qrWrap.hidden=false;const target=document.getElementById('qrcode');if(!target.dataset.ready){if(window.QRCode){new QRCode(target,{text:location.href,width:210,height:210,colorDark:'#08080a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});target.dataset.ready='1'}else notify('QR generator unavailable. Check your connection')}qrWrap.scrollIntoView({behavior:'smooth',block:'nearest'})}
</script>
