<style>
:root{color-scheme:dark;--bg:#08080a;--text:#f9f9fc;--muted:#b3b3bd;--cyan:#b8efff;--pink:#f1b5ff;--blue:#a9b6ff;--mint:#b0f5d9}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% 10%,rgba(255,255,255,.1),transparent 38%),radial-gradient(ellipse at 12% 65%,rgba(91,135,255,.14),transparent 38%),radial-gradient(ellipse at 88% 72%,rgba(221,106,255,.1),transparent 40%),linear-gradient(180deg,rgba(5,5,8,.3),rgba(5,5,8,.9))}
.bg-video{position:fixed;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.05)}
.wrap{width:min(100% - 30px,700px);margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom))}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#c4c4ce;font:9px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}.status{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.hero{text-align:center;padding:26px 0 16px}.orbit-scene{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:0 auto 19px;display:grid;place-items:center}
.ring{position:absolute;inset:3%;border-radius:50%;border:1px solid rgba(255,255,255,.14);animation:spin 32s linear infinite}.ring:before,.ring:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 15px rgba(167,230,255,.9)}.ring:before{top:10%;left:23%}.ring:after{right:12%;bottom:19%;background:var(--pink)}
.ring.r2{inset:15%;border-style:dashed;border-color:rgba(255,255,255,.12);animation:spinback 42s linear infinite}.ring.r3{inset:29%;border-color:rgba(255,255,255,.1);animation:spin 52s linear infinite}
.core{width:39%;aspect-ratio:1;border-radius:50%;padding:3px;background:conic-gradient(var(--cyan),rgba(255,255,255,.14),var(--pink),var(--blue),var(--mint),var(--cyan));box-shadow:0 0 55px rgba(158,174,255,.23);animation:breathe 5s ease-in-out infinite}.core-inner{height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 20%,#45454b,#19191d 58%,#08080a);border:3px solid rgba(12,12,15,.95);font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.09em;overflow:hidden}.profile-photo{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinback{to{transform:rotate(-360deg)}}@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.14)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
h1{font-size:clamp(30px,7vw,43px);letter-spacing:-.065em;line-height:1.04;margin:0 0 9px}.subtitle{color:#d0d0d8;font-size:13px;line-height:1.7;margin:0}.tagline{font:9px "DM Mono",monospace;letter-spacing:.07em;color:#a8a8b3;line-height:1.8;margin:11px 0 0}
.bubble-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px 2px 8px}
.bubble{position:relative;isolation:isolate;overflow:hidden;min-height:145px;border-radius:30px;padding:17px 14px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--text);cursor:pointer;border:1px solid rgba(255,255,255,.22);background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.23),transparent 38%),linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.035) 55%,rgba(255,255,255,.09));backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%);box-shadow:inset 0 2px 3px rgba(255,255,255,.22),inset 0 -8px 18px rgba(0,0,0,.18),0 12px 28px rgba(0,0,0,.22);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent;animation:float 5.5s ease-in-out infinite}
.bubble:nth-child(2n){animation-delay:-2.1s}.bubble:nth-child(3n){animation-delay:-3.5s}
.bubble:before{content:"";position:absolute;inset:-100% -60%;z-index:-1;opacity:.5;background:linear-gradient(105deg,transparent 37%,rgba(255,255,255,.23) 49%,transparent 60%);background-size:200% 100%;animation:sheen 8s linear infinite;pointer-events:none}
.bubble:after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(140deg,rgba(167,230,255,.15),transparent 45%,rgba(241,181,255,.16));opacity:.45;transition:opacity .25s}
.bubble:hover,.bubble:focus-visible{transform:translateY(-5px) scale(1.025);border-color:rgba(255,255,255,.48);box-shadow:inset 0 2px 3px rgba(255,255,255,.3),0 18px 38px rgba(0,0,0,.3),0 0 25px rgba(167,230,255,.1);outline:none}.bubble:active{transform:scale(.96)}.bubble:hover:after{opacity:.95}
.bubble-icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.27),rgba(255,255,255,.045) 65%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 4px rgba(255,255,255,.19),0 8px 18px rgba(0,0,0,.17);font-size:27px;flex:0 0 auto}
.bubble-icon svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.bubble-icon img{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}.bubble:first-child .bubble-icon{padding:0;overflow:hidden;border-color:rgba(255,255,255,.45)}.expand-icon img{width:100%;height:100%;object-fit:cover;object-position:center 23%;border-radius:50%;display:block}.expand-icon{overflow:hidden;padding:0}
.bubble strong{font-size:13px;font-weight:700;letter-spacing:-.01em}.bubble small{font-size:10px;color:#c4c4cf;line-height:1.4}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 10px 25px rgba(0,0,0,.18)}
.expanded{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));background:rgba(0,0,0,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .25s}
.expanded.open{opacity:1;pointer-events:auto}.expand-card{position:relative;width:min(100%,470px);max-height:88svh;overflow:auto;border-radius:34px;padding:25px 21px 24px;background:linear-gradient(150deg,rgba(42,42,48,.94),rgba(14,14,18,.94));border:1px solid rgba(255,255,255,.27);box-shadow:inset 0 1px 2px rgba(255,255,255,.22),0 30px 90px rgba(0,0,0,.55);transform:scale(.78);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.expanded.open .expand-card{transform:scale(1)}.expand-head{display:flex;align-items:center;gap:14px;margin:0 0 20px}.expand-icon{width:62px;height:62px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:27px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 4px rgba(255,255,255,.2),0 8px 20px rgba(0,0,0,.2)}.expand-icon svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.expand-head h2{font-size:25px;letter-spacing:-.05em;margin:0}.expand-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.close{margin-left:auto;width:40px;height:40px;flex:0 0 auto;border-radius:50%;color:#fff;font-size:24px;cursor:pointer}
.content-list{display:grid;gap:10px}.action{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:19px;padding:12px 15px;color:#f9f9fc;text-decoration:none;font-size:12px;font-weight:650;cursor:pointer;text-align:left;width:100%}.action .act-icon{font-size:19px;width:28px;text-align:center}.action .arrow{margin-left:auto;color:#bfc0cc;font-size:17px}.action:hover{border-color:rgba(255,255,255,.42);background:linear-gradient(120deg,rgba(167,230,255,.13),rgba(241,181,255,.1))}
.qr-wrap{text-align:center;margin-top:18px}.qr-wrap #qrcode{display:inline-block;background:white;padding:12px;border-radius:14px}.qr-wrap p{color:var(--muted);font-size:11px}
.footer{text-align:center;color:#777782;font:9px "DM Mono",monospace;letter-spacing:.1em;line-height:1.8;padding:20px 0 5px}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:linear-gradient(135deg,#fafafa,#c5cada);color:#101014;padding:12px 17px;border-radius:999px;font-size:12px;font-weight:800;transition:.25s;max-width:calc(100% - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.bubble-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.bubble{min-height:150px}.hero{padding-top:20px}.orbit-scene{width:210px}}
@media(max-width:380px){.wrap{width:calc(100% - 22px)}.orbit-scene{width:56vw;max-width:195px;margin-bottom:15px}.hero{padding-top:18px}.bubble-grid{gap:10px}.bubble{min-height:132px;border-radius:26px;padding:13px 10px}.bubble-icon{width:58px;height:58px;font-size:24px}.bubble strong{font-size:12px}.bubble small{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="expanded" id="expanded" aria-hidden="true"><section class="expand-card glass" role="dialog" aria-modal="true" aria-labelledby="expandTitle"><div class="expand-head"><div class="expand-icon" id="expandIcon"></div><div><h2 id="expandTitle">Contact</h2><p id="expandSubtitle">Quick links</p></div><button class="close glass" id="closeExpand" aria-label="Close">×</button></div><div class="content-list" id="expandContent"></div><div class="qr-wrap" id="qrWrap" hidden><div id="qrcode"></div><p>Scan to open this digital card.</p></div></section></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const data={
 contact:{title:'Contact',subtitle:'Reach out or save my details',icon:'<img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3KwHOVnuYOkW2oN0MTIORaA0VtB/89e27f58-d9ba-4501-947b-2d7f20046376.jpg" alt="Thejus T.K." referrerpolicy="no-referrer">',items:[['＋','Save my contact','thejus-tk.vcf','download'],['◉','WhatsApp','https://wa.me/919611638650?text=Hi%20Thejus%2C%20we%20connected%20through%20your%20digital%20card.','external'],['✉','Email me','mailto:thejus.tk@gmail.com'],['⌕','Call me','tel:+919611638650']]},
 social:{title:'Social',subtitle:'Find me around the web',icon:'◎',items:[['in','LinkedIn','https://www.linkedin.com/in/thejus-tk-34966795?originalSubdomain=in','external'],['◎','Instagram','https://www.instagram.com/inexplicable_psyche/','external'],['✉','Email','mailto:thejus.tk@gmail.com']]},
 portfolio:{title:'Portfolio',subtitle:'Work, projects and experiments',icon:'⌘',items:[['⌘','Personal portfolio','https://thejustk-byte.github.io','external'],['◈','GitHub projects','https://github.com/thejustk-byte','external'],['in','Professional profile','https://www.linkedin.com/in/thejus-tk-34966795','external']]},
 interests:{title:'Interests',subtitle:'A few things that keep me curious',icon:'✦',items:[['⌁','Mountain state of mind','Travel · Quiet places · Coastal roots','info'],['↗','Petrolhead energy','Cars · Roads · Precision','info'],['♫','Lost in the frequency','Music · Psytrance','info'],['▧','Frame by frame','Visuals · Creative experiments','info']]},
 github:{title:'GitHub',subtitle:'Building and experimenting',icon:'⌘',items:[['◈','Open GitHub profile','https://github.com/thejustk-byte','external'],['⌘','Personal portfolio','https://thejustk-byte.github.io','external']]},
 share:{title:'Share this card',subtitle:'Pass the connection forward',icon:'↗',items:[['↗','Share my card','#share','share'],['▣','Copy card link','#copy','copy'],['▦','Show QR code','#qr','qr'],['＋','Download contact file','thejus-tk.vcf','download']]}
};
const overlay=document.getElementById('expanded'),content=document.getElementById('expandContent'),icon=document.getElementById('expandIcon'),title=document.getElementById('expandTitle'),subtitle=document.getElementById('expandSubtitle'),qrWrap=document.getElementById('qrWrap'),toast=document.getElementById('toast');let toastTimer,previousFocus=null;
function haptic(){if('vibrate'in navigator){try{navigator.vibrate(14)}catch(e){}}}
function notify(m){haptic();toast.textContent=m;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function openBubble(key,button){const d=data[key];if(!d)return;haptic();previousFocus=button;title.textContent=d.title;subtitle.textContent=d.subtitle;icon.innerHTML=d.icon;content.replaceChildren();qrWrap.hidden=true;
 d.items.forEach(([sym,label,url,kind])=>{if(kind==='info'){const el=document.createElement('div');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span>';el.children[0].textContent=sym;el.children[1].textContent=label+' · '+url;content.append(el);return}
 const el=document.createElement(kind==='share'||kind==='copy'||kind==='qr'?'button':'a');el.className='action glass';el.innerHTML='<span class="act-icon"></span><span></span><span class="arrow">↗</span>';el.children[0].textContent=sym;el.children[1].textContent=label;
 if(kind==='download'){el.href=url;el.download=''}else if(kind==='external'||!kind){el.href=url;if(kind==='external'){el.target='_blank';el.rel='noopener noreferrer'}}else{el.type='button';el.addEventListener('click',()=>{if(kind==='share')shareCard();if(kind==='copy')copyLink();if(kind==='qr')showQr()})}
 content.append(el)});
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('closeExpand').focus()}
function closeBubble(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';if(previousFocus)previousFocus.focus();haptic()}
document.querySelectorAll('[data-bubble]').forEach(b=>b.addEventListener('click',()=>openBubble(b.dataset.bubble,b)));
document.getElementById('closeExpand').addEventListener('click',closeBubble);overlay.addEventListener('click',e=>{if(e.target===overlay)closeBubble()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeBubble()});
async function copyLink(){try{await navigator.clipboard.writeText(location.href);notify('Card link copied')}catch(e){const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify('Card link copied')}}
async function shareCard(){const d={title:'Thejus T.K. — Digital Card',text:'Connect with Thejus T.K.',url:location.href};if(navigator.share){try{await navigator.share(d)}catch(e){if(e.name!=='AbortError')notify('Sharing was not available')}}else copyLink()}
function showQr(){qrWrap.hidden=false;const target=document.getElementById('qrcode');if(!target.dataset.ready){if(window.QRCode){new QRCode(target,{text:location.href,width:210,height:210,colorDark:'#08080a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});target.dataset.ready='1'}else notify('QR generator unavailable. Check your connection')}qrWrap.scrollIntoView({behavior:'smooth',block:'nearest'})}
</script>
